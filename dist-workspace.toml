[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
# Never package flintshot-cosmic: it needs libcosmic system deps the
# release runners don't install (it stays an opt-in CI-build crate).
packages = ["flintshot-app"]
# Release = the launcher promise: tray ships everywhere it can.
features = ["tray"]
# Build with --package; the workspace build would drag in
# flintshot-cosmic's system deps.
precise-builds = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["shell", "powershell", "msi", "homebrew"]
# Homebrew channel: formula is pushed to this tap on each release.
# Requires repo secret HOMEBREW_TAP_TOKEN (PAT, repo scope) — see
# docs/specs/release-pipeline/tasks/004-homebrew-tap.md.
tap = "l1br3-io/homebrew-tap"
# Formula name is what users type: `brew install flintshot` (the
# binary name), not the cargo package name flintshot-app.
formula = "flintshot"
publish-jobs = ["homebrew"]
# Spec'd format: tar.gz decompresses everywhere; xz (0.32's default)
# still trips up some minimal systems.
unix-archive = ".tar.gz"
# PRs build (but don't publish) artifacts, proving the matrix stays
# green on release-config changes.
pr-run-mode = "upload"

[dist.github-custom-runners]
# glibc 2.35 floor: binary runs on Debian 12+, Ubuntu 22.04+, Fedora 39+
x86_64-unknown-linux-gnu = "ubuntu-22.04"

# XCAP_LINUX_DEPS from ci.yml plus the tray feature's GTK stack.
[dist.dependencies.apt]
pkg-config = "*"
libclang-dev = "*"
libxcb1-dev = "*"
libxrandr-dev = "*"
libdbus-1-dev = "*"
libpipewire-0.3-dev = "*"
libwayland-dev = "*"
libegl-dev = "*"
libgbm-dev = "*"
libgtk-3-dev = "*"
libayatana-appindicator3-dev = "*"
