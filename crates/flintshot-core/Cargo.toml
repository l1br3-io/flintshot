[package]
name = "flintshot-core"
description = "Platform-agnostic core for flintshot: geometry, editor state, Canvas/EditorShell traits, Backend upload trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ab_glyph = "0.2"
base64 = { workspace = true }
dirs = { workspace = true }
fontdb = "0.23"
image = { workspace = true }
imageproc = { workspace = true }
keyring = { workspace = true }
# Pure-Rust OCR engine (author's own RTen NN runtime — no C linkage,
# no system deps). Models are NOT embedded and never fetched silently:
# loading is consent-gated (see src/ocr/). Pre-approved in the
# ocr-region plan (SPEC-ocr-region.md "Tech Stack").
ocrs = "0.13"
postcard = { workspace = true }
# Direct edge onto ocrs's own NN runtime (same 0.26 the lockfile
# already resolves via ocrs): the engine loader names
# rten::Model/LoadError when feeding OcrEngineParams.
rten = "0.26"
serde = { workspace = true }
# Session-capture sidecars (<id>.json); already in the lockfile via
# the former dev-dependency — no new crate.
serde_json = "1"
# Temp PNG seam for the tesseract CLI wrapper (ocr/tesseract.rs):
# the engine writes the region image to a NamedTempFile so tesseract
# has a path to read. Was dev-only; the wrapper is the first prod
# use (same workspace pin, already in the lockfile).
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
xcap = { workspace = true }

# Native capture backends: the XDG Screenshot Portal client (zbus,
# blocking facade) is Linux-only — macOS/Windows compile no D-Bus code.
# Same workspace entry ashpd resolves to in flintshot-app, so the
# dependency graph never carries two zbus majors.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
