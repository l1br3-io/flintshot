[package]
name = "flintshot-core"
description = "Platform-agnostic core for flintshot: geometry, editor state, Canvas/EditorShell traits, Backend upload trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ab_glyph = "0.2"
dirs = { workspace = true }
fontdb = "0.23"
image = { workspace = true }
imageproc = { workspace = true }
keyring = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
xcap = { workspace = true }

# Native capture backends: the XDG Screenshot Portal client (zbus,
# blocking facade) is Linux-only — macOS/Windows compile no D-Bus code.
# Same workspace entry ashpd resolves to in flintshot-app, so the
# dependency graph never carries two zbus majors.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
serde_json = "1"
tempfile = { workspace = true }
