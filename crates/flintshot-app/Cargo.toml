[package]
name = "flintshot-app"
description = "flintshot CLI: daemon, region capture, fullscreen, pin, upload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "flintshot"
path = "src/main.rs"

[features]
default = ["egui"]
egui = ["dep:flintshot-editor-egui"]
# System-tray support is opt-in: `tray-icon` pulls the GTK3 stack on
# Linux (libappindicator → gtk/gdk/cairo/glib), which the default CI
# build doesn't install. The daemon runs without it (IPC + hotkeys +
# single-instance still work); the tray is best-effort. Build with
# `--features tray` (and GTK dev libs present) to enable it. See
# ADR-0018/0019 area + Task 012's dedicated daemon-build CI job.
tray = ["dep:tray-icon"]

[dependencies]
flintshot-core = { workspace = true }
flintshot-editor-egui = { workspace = true, optional = true }
clap = { workspace = true }
color-eyre = { workspace = true }
global-hotkey = { workspace = true }
image = { workspace = true }
interprocess = { workspace = true }
notify = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
single-instance = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
