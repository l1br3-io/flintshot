[package]
name = "flintshot-app"
description = "flintshot CLI: daemon, region capture, fullscreen, upload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "flintshot"
path = "src/main.rs"

# WiX identity for the msi installer (stable GUIDs so upgrades
# replace instead of side-by-side install; license/eula off — nobody
# should "agree" to MIT/Apache).
[package.metadata.wix]
upgrade-guid = "6c55b274-9df3-4fc3-82c4-ffd9e35ab681"
path-guid = "932eac9d-b2ac-4efd-a40c-9afbfd94b760"
license = false
eula = false

# Scoped to the one released package: workspace-level replacements
# would run once per crate against the same root file. Rewrites the
# Keep-a-Changelog Unreleased header into the released version and
# re-opens a fresh Unreleased section above it. Anchored + exactly=1:
# the changelog's prose mentions "## [Unreleased]" literally (release
# checklist section) — an unanchored pattern would rewrite those too.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "^## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]

# Debian package (built by packaging/linux/build-packages.sh; CI job
# runs on ubuntu-22.04 = glibc 2.35 floor). Depends lists DIRECT
# sonames from `readelf -d` on the tray binary plus the dlopen-only
# libappindicator (tray-icon loads it at runtime, so it never shows
# in NEEDED). Explicit, not $auto: shlibdeps would emit builder-host
# names and the 24.04 t64 rename (libgtk-3-0 -> libgtk-3-0t64) breaks
# single-name deps across releases — `|` alternatives cover both eras.
[package.metadata.deb]
maintainer = "flintshot contributors (https://github.com/l1br3-io/flintshot)"
section = "utils"
# libpipewire-0.3-0: dlopen'd at runtime by xcap's pipewire capture
# path (not NEEDED-linked, so shlibdeps misses it) — Depend on it or
# Wayland capture breaks on minimal systems. No t64 rename for this
# lib (pipewire 1.x still ships the 0.3 soname).
depends = "libayatana-appindicator3-1, libpipewire-0.3-0, libgtk-3-0 | libgtk-3-0t64, libglib2.0-0 | libglib2.0-0t64, libgdk-pixbuf-2.0-0 | libgdk-pixbuf-2.0-0t64, libxdo3, libgbm1, libxcb1, libgcc-s1, libc6"
assets = [
    ["target/release/flintshot", "usr/bin/", "755"],
    ["../../assets/applications/flintshot.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/hicolor/scalable/apps/flintshot.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

# Fedora-side names for the same runtime set (xcap's capture libs +
# tray's GTK/appindicator/xdo). Explicit: rpmbuild-style auto-detection
# isn't available from a debian:12 container, and Fedora renames
# differ (gtk3, mesa-libgbm, pipewire-libs, libxdo). Verified by the
# fedora:39 container install test in the release-pipeline effort.
[package.metadata.generate-rpm]
requires = {
    "gtk3" = "*",
    "libayatana-appindicator-gtk3" = "*",
    "libxdo" = "*",
    "mesa-libgbm" = "*",
    "mesa-libEGL" = "*",
    "pipewire-libs" = "*",
    "libwayland-client" = "*",
    "libxkbcommon" = "*",
    "libXrandr" = "*",
    "libxcb" = "*",
    "dbus-libs" = "*",
}
# NOTE on paths: unlike cargo-deb (workspace-target-relative), these
# resolve relative to THIS manifest's directory — hence ../../ for the
# workspace target/ and assets/.
assets = [
    { source = "../../target/release/flintshot", dest = "/usr/bin/flintshot", mode = "755" },
    { source = "../../assets/applications/flintshot.desktop", dest = "/usr/share/applications/flintshot.desktop", mode = "644" },
    { source = "../../assets/icons/hicolor/scalable/apps/flintshot.svg", dest = "/usr/share/icons/hicolor/scalable/apps/flintshot.svg", mode = "644" },
]

[features]
default = ["egui"]
egui = ["dep:flintshot-editor-egui"]
# System-tray support is opt-in: `tray-icon` pulls the GTK3 stack on
# Linux (libappindicator → gtk/gdk/cairo/glib), which default builds
# don't install. The daemon runs without it (IPC + hotkeys +
# single-instance still work); the tray is best-effort. Build with
# `--features tray` (and GTK dev libs present) to enable it — CI
# compiles this path in the `tray-build` job. See ADR-0018/0019 area.
tray = ["dep:tray-icon", "dep:gtk", "dep:zbus"]

[dependencies]
flintshot-core = { workspace = true }
flintshot-editor-egui = { workspace = true, optional = true }
arboard = { workspace = true }
ashpd = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
futures-util = { workspace = true }
global-hotkey = { workspace = true }
image = { workspace = true }
interprocess = { workspace = true }
keyring = { workspace = true }
notify = { workspace = true }
notify-rust = { workspace = true }
postcard = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
# Response-body decoding in the AI client (already in the lockfile
# via flintshot-core).
serde_json = "1"
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true, optional = true }

# GTK is needed on Linux to initialize libappindicator (tray-icon's
# backend) before building the tray/menu. Target-scoped + optional so
# the default build stays GTK-free. zbus backs the SNI watchdog's
# D-Bus calls (same target-scoped + optional shape).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

# Non-Linux keeps the crate's lock (flock file / named mutex); Linux
# uses a std abstract-socket lock in `single.rs` instead — the crate's
# non-CLOEXEC fd let daemon-spawned editors ghost-hold the lock after
# the daemon exited (ADR-0033).
[target.'cfg(not(target_os = "linux"))'.dependencies]
single-instance = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
