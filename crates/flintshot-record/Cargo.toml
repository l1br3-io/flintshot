[package]
name = "flintshot-record"
description = "Screen-recording engine for flintshot: XDG ScreenCast portal + GStreamer pipeline to a finalized MP4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The only crate in the workspace that links GStreamer (see lib.rs
# docs). Needs libgstreamer1.0-dev at build time; elements are
# probed at runtime so a sparse plugin set degrades, never panics.
gstreamer = "0.23"
flintshot-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Integration tests finalize real pipelines into temp dirs and drive
# the async prepare contract.
tempfile = { workspace = true }
tokio = { workspace = true }
