[package]
name = "flintshot-cosmic"
description = "COSMIC panel applet for flintshot — talks IPC to a running daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "flintshot_cosmic"
path = "src/lib.rs"

[[bin]]
name = "flintshot-cosmic"
path = "src/main.rs"

[dependencies]
flintshot-core = { workspace = true }
flintshot-ipc = { workspace = true }
color-eyre = { workspace = true }
interprocess = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# libcosmic is heavy (cmake, fontconfig, xkbcommon) and is NOT published to
# crates.io — pop-os ships it via git only. We track `master` (the integration
# branch pop-os's own applets use); release tags like `v0.12` bit-rot quickly
# against cosmic-text. Bump deliberately; CI will surface breakage.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", branch = "master", default-features = false, features = [
    "tokio",
    "wayland",
    "multi-window",
    "applet",
] }

[dev-dependencies]
tempfile = { workspace = true }
futures = "0.3"
