[workspace]
resolver = "2"
members = [
    "crates/flintshot-app",
    "crates/flintshot-core",
    "crates/flintshot-cosmic",
    "crates/flintshot-editor-egui",
]
default-members = ["crates/flintshot-app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/l1br3-io/flintshot"
homepage = "https://github.com/l1br3-io/flintshot"
authors = ["flintshot contributors"]

[workspace.dependencies]
flintshot-core = { path = "crates/flintshot-core", version = "0.0.0" }
flintshot-editor-egui = { path = "crates/flintshot-editor-egui", version = "0.0.0" }

# GOTCHA: without `wayland-data-control`, arboard is X11-only on
# Linux (x11rb) — on a Wayland session every read/write rides
# XWayland's clipboard bridge, whose Wayland→X11 sync is
# lazy/focus-gated, so clipboard access fails nondeterministically
# (bit the portal `clipboard:///` read-back; see
# docs/specs/portal-clipboard-uri/). The feature adds wl-clipboard-rs
# (native zwlr_data_control_v1, pure Rust); X11 sessions still take
# the x11rb path. `image-data` is declared here too: the app's
# clipboard code uses `arboard::ImageData` unconditionally, so
# relying on eframe's transitive enablement broke `--no-default-
# features` builds.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# default-features = false + tokio: ashpd's defaults pull the async-io
# zbus backend, which would clash with the daemon's tokio runtime.
# global_shortcuts is the Phase 6 portal interface. zbus is pure Rust,
# so this adds no system deps (CI stays green unchanged).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
# Data-URL payload for AI vision message parts (flintshot-core); tiny,
# no transitive deps beyond itself.
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
# Markdown rendering for the AI panel's assistant cards (Task 008).
# Pin 0.24 = the egui 0.35 line (0.25 targets egui 0.36).
# default-features off drops `load-images`: assistant markdown must
# never fetch remote content (spec boundary — no third-party
# traffic). Code blocks render plain (no syntect) on the theme's
# tinted fill. Fallback if this pin is ever rejected: vendor a
# minimal renderer in ai_panel.rs (headings/lists/fenced code/
# tables) — one-branch switch at the `assistant_markdown` fn.
egui_commonmark = { version = "0.24", default-features = false }
# default-features off so consumers pick the feature set (the editor
# crate excludes `accesskit` — see its Cargo.toml for why).
eframe = { version = "0.35", default-features = false }
egui = "0.35"
futures-util = "0.3"
global-hotkey = "0.8"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
interprocess = { version = "2", features = ["tokio"] }
keyring = { version = "3", features = ["crypto-rust"] }
mockito = "1"
notify = "8"
notify-rust = "4"
postcard = { version = "1", features = ["alloc"] }
# rustls-tls (not native-tls) avoids a libssl-dev build-time system dep —
# CI installs xcap's native libs but not OpenSSL. Functionally identical
# for HTTPS + multipart + json. See ADR-0026 (Task 010).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
rfd = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
single-instance = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
# Transform-store ids (uuid v4); already in the lockfile transitively.
uuid = { version = "1", features = ["v4"] }
xcap = "0.9"
# Direct dep for the SNI watchdog's poke-to-activate calls (the `gtk`
# stack has no D-Bus client). tokio backend to match ashpd's pin —
# and the version resolves onto ashpd's zbus 5.18, so this adds a
# dep edge, not a new crate build. See ADR-0032.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# cargo-dist builds with --profile dist (its own profile so it never
# fights local release builds); mirror the release settings.
[profile.dist]
inherits = "release"

[profile.dev]
debug = "line-tables-only"
