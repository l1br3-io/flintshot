[workspace]
resolver = "2"
members = [
    "crates/flintshot-app",
    "crates/flintshot-core",
    "crates/flintshot-cosmic",
    "crates/flintshot-editor-egui",
]
default-members = ["crates/flintshot-app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/flintshot"
homepage = "https://github.com/anomalyco/flintshot"
authors = ["flintshot contributors"]

[workspace.dependencies]
flintshot-core = { path = "crates/flintshot-core", version = "0.0.0" }
flintshot-editor-egui = { path = "crates/flintshot-editor-egui", version = "0.0.0" }

arboard = { version = "3", default-features = false }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
eframe = "0.35"
egui = "0.35"
global-hotkey = "0.8"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
interprocess = { version = "2", features = ["tokio"] }
keyring = { version = "3", features = ["crypto-rust"] }
notify = "8"
postcard = { version = "1", features = ["alloc"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
single-instance = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
xcap = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
